[workspace]

[package]
name = "delivered"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Turn a folder of stems into a client delivery sheet"
readme = "README.md"
keywords = ["audio", "loudness", "wav", "delivery"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "delivered"
path = "src/main.rs"

[[bin]]
name = "make-fixtures"
path = "src/bin/make_fixtures.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
